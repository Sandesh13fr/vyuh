<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyuh mark · light</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden}
body{font-family:"Schibsted Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
body{background:#f3f4fa}
.artboard{width:512px;height:512px;overflow:hidden;display:grid;place-items:center;background:#f3f4fa}
.artboard svg{display:block;width:320px;height:320px}
</style>
</head>
<body>
<main class="artboard" aria-label="Vyuh logo">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vyuh">
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2b3180" stroke-width="6" stroke-linecap="round" stroke-dasharray="140 30" transform="rotate(-60 32 32)"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#2b3180" stroke-width="6" stroke-linecap="round" stroke-dasharray="80 20" transform="rotate(120 32 32)"/>
  <circle cx="32" cy="32" r="6" fill="#f2b233"/>
</svg>
</main>
</body>
</html>
