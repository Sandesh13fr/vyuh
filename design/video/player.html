<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vyuh Explainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Serif+JP:wght@400;700;900&family=VT323&display=block">
<style>
  :root { --bar:#1a0838; --ink:#f4ecff; --ink2:#c7b6e6; --accent:#ff71ce; --line:#3a2266; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--ink); font:400 15px/1.4 Inter, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; }
  canvas { max-width:100%; max-height:100%; aspect-ratio:16/9; width:auto; height:auto; }
  #stage.drag::after { content:'Drop voiceover audio'; position:absolute; inset:16px; border:2px dashed var(--accent); border-radius:12px; display:grid; place-items:center; font:400 36px VT323, monospace; background:rgba(20,0,40,0.6); }
  .bar { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--bar); border-top:1px solid var(--line); flex-wrap:wrap; }
  button, label.btn { background:#2a1052; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font:600 14px Inter, sans-serif; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button:focus-visible, label.btn:focus-within, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=range] { flex:1; min-width:160px; accent-color:var(--accent); }
  .time { font:400 22px VT323, monospace; min-width:110px; text-align:right; }
  .vo { color:var(--ink2); font-size:13px; max-width:28ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720" aria-label="Vyuh explainer animation"></canvas></div>
<div class="bar">
  <button id="play" type="button" aria-label="Play">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub">
  <span class="time" id="time">0.0 / 0.0</span>
  <button id="snd" type="button" aria-pressed="true">Sound on</button>
  <button id="loop" type="button" aria-pressed="true">Loop on</button>
  <label class="btn">Load voiceover<input id="file" type="file" accept="audio/*"></label>
  <span class="vo" id="vo">no voiceover</span>
</div>
<audio id="audio" preload="auto"></audio>
<script src="lib/harness.js"></script>
<script src="lib/sound.js"></script>
<script src="timing.js" onerror="void 0"></script>
<script src="vyuh-vw.js"></script>
<script>
(async () => {
  const { explainer, scoreSound, DURATION, FONTS } = window.VYUH;
  const sample = 'AaZz09七つの輪エージェントが鍵を持つ✕→▶';
  try { await Promise.all(FONTS.concat(['400 30px "VT323"', '700 40px "Noto Serif JP"', '600 56px "Inter"', '900 110px "Noto Serif JP"', '900 76px "Noto Serif JP"']).map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) {}

  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const audio = document.getElementById('audio');
  const $ = (id) => document.getElementById(id);
  let t = 0, playing = false, soundOn = true, loop = true, hasVO = false, stopSound = null, lastNow = 0;

  function draw(tt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    explainer(ctx, 1280, 720, Math.max(0, Math.min(DURATION, tt)));
  }
  window.seek = (tt) => { t = tt; draw(tt); };
  window.DURATION = DURATION;
  window.scoreSound = scoreSound;

  const ui = () => { $('scrub').value = Math.round((t / DURATION) * 1000); $('time').textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}`; $('play').textContent = playing ? 'Pause' : 'Play'; };
  // voiceover mode only when narration is loaded; otherwise the full mix (beds + music)
  const startSound = () => { stopSoundNow(); if (soundOn && playing) stopSound = SOUND.live(scoreSound, t, { voiceover: hasVO }); };
  const stopSoundNow = () => { if (stopSound) { stopSound(); stopSound = null; } };

  function play() {
    if (t >= DURATION - 0.01) t = 0;
    playing = true;
    if (hasVO) { audio.currentTime = t; audio.muted = !soundOn; audio.play(); }
    lastNow = performance.now(); startSound(); ui();
  }
  function pause() { playing = false; if (hasVO) audio.pause(); stopSoundNow(); ui(); }
  function seekTo(tt) { t = Math.max(0, Math.min(DURATION, tt)); if (hasVO) audio.currentTime = t; draw(t); if (playing) startSound(); ui(); }

  function frame(now) {
    if (playing) {
      if (hasVO) t = audio.currentTime; else t += (now - lastNow) / 1000;
      lastNow = now;
      if (t >= DURATION) {
        if (loop) { seekTo(0); if (hasVO) audio.play(); }
        else { t = DURATION; pause(); }
      }
      draw(t); ui();
    }
    requestAnimationFrame(frame);
  }

  $('play').onclick = () => (playing ? pause() : play());
  $('scrub').oninput = (e) => seekTo((e.target.value / 1000) * DURATION);
  $('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = soundOn ? 'Sound on' : 'Sound off'; $('snd').setAttribute('aria-pressed', soundOn); audio.muted = !soundOn; soundOn ? startSound() : stopSoundNow(); };
  $('loop').onclick = () => { loop = !loop; $('loop').textContent = loop ? 'Loop on' : 'Loop off'; $('loop').setAttribute('aria-pressed', loop); };
  function loadVO(file) {
    if (!file || !file.type.startsWith('audio')) return;
    pause(); audio.src = URL.createObjectURL(file); hasVO = true; $('vo').textContent = file.name; seekTo(0);
  }
  $('file').onchange = (e) => loadVO(e.target.files[0]);
  const stage = $('stage');
  stage.ondragover = (e) => { e.preventDefault(); stage.classList.add('drag'); };
  stage.ondragleave = () => stage.classList.remove('drag');
  stage.ondrop = (e) => { e.preventDefault(); stage.classList.remove('drag'); loadVO(e.dataTransfer.files[0]); };
  audio.onended = () => { if (!loop) pause(); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

  draw(0); ui(); requestAnimationFrame(frame);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
