<!doctype html>
<html><head><meta charset="utf-8"><title>Vyuh Frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Serif+JP:wght@400;700;900&family=VT323&display=block">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="lib/harness.js"></script><script src="lib/sound.js"></script><script src="vyuh-vw.js"></script>
<script>
// Debug/render helper: frame.html?t=12.3 draws one frame at full size.
(async () => {
  const sample = 'AaZz09七つの輪エージェントが鍵を持つ✕→▶';
  try { await Promise.all(VYUH.FONTS.concat(['400 30px "VT323"','700 40px "Noto Serif JP"','600 56px "Inter"','900 110px "Noto Serif JP"','900 76px "Noto Serif JP"']).map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) {}
  const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  VYUH.explainer(ctx, 1280, 720, parseFloat(new URLSearchParams(location.search).get('t') || '0'));
  document.body.dataset.ready = '1';
})();
</script></body></html>
