[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./" }]

[invariant]
runs = 128
depth = 32
fail_on_revert = true

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[etherscan]
hsk = { key = "not-required", chain = 177, url = "https://hashkey.blockscout.com/api" }
